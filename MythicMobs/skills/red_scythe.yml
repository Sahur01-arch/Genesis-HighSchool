Crimson_Idle:
  Skills:
  - effect:particles{particle=flame;amount=1;hS=0.15;vS=0.15;speed=0} @self
  - effect:particles{particle=redstone;color=#ff2b2b;amount=1;hS=0.15;vS=0.15;speed=0} @self

# --- CRIMSON SLASH (Proyektil Meluncur ke Depan) ---
Crimson_Slash:
  Cooldown: 0.3
  Conditions:
  - hasaurastacks{auraName=Crimson_Combo;stacks=2} castinstead Crimson_Executor
  Skills:
  - Aura{auraName=Crimson_Combo;duration=40;maxStacks=3} @self
  - sound{s=entity.player.attack.sweep;v=1;p="random(0.9,1.1)"} @self
  - randomskill{skills=Crimson_Slash_Vertical,Crimson_Slash_Horizontal,Crimson_Slash_Diagonal} @self

# Proyektil ditembakkan ke depan. v=1 (kecepatan stabil), mr=10 (jarak), g=0 (anti gravitasi)
Crimson_Slash_Vertical:
  Skills:
  - projectile{onTick=Crimson_Slash_Shape_V;onHit=Crimson_Slash_Hit;v=1;i=1;mr=10;hR=1.5;vR=1.5;hnp=true;g=0} @Forward{f=1;y=1.1}

Crimson_Slash_Horizontal:
  Skills:
  - projectile{onTick=Crimson_Slash_Shape_H;onHit=Crimson_Slash_Hit;v=1;i=1;mr=10;hR=1.5;vR=1.5;hnp=true;g=0} @Forward{f=1;y=1.1}

Crimson_Slash_Diagonal:
  Skills:
  - projectile{onTick=Crimson_Slash_Shape_D;onHit=Crimson_Slash_Hit;v=1;i=1;mr=10;hR=1.5;vR=1.5;hnp=true;g=0} @Forward{f=1;y=1.1}

# Bentuk slash digambar mengikuti origin (posisi proyektil saat ini). speed=0 agar garis tetap solid.
Crimson_Slash_Shape_V:
  Skills:
  - slash{y=0;w=3;h=20;mpd=true;a=140;radius=1.5;roll=0;
      oP=[ - effect:particles{particle=redstone;color=#ff2b2b;amount=1;speed=0}
           - effect:particles{particle=flame;amount=1;speed=0} ]
    } @origin

Crimson_Slash_Shape_H:
  Skills:
  - slash{y=0;w=3;h=20;mpd=true;a=140;radius=1.5;roll=90;
      oP=[ - effect:particles{particle=redstone;color=#ff2b2b;amount=1;speed=0}
           - effect:particles{particle=flame;amount=1;speed=0} ]
    } @origin

Crimson_Slash_Shape_D:
  Skills:
  - slash{y=0;w=3;h=20;mpd=true;a=140;radius=1.5;roll=45;
      oP=[ - effect:particles{particle=redstone;color=#ff2b2b;amount=1;speed=0}
           - effect:particles{particle=flame;amount=1;speed=0} ]
    } @origin

# Dipicu otomatis saat proyektil menabrak musuh
Crimson_Slash_Hit:
  Skills:
  - damage{amount=5} @target
  - effect:particles{particle=lava;amount=3;hS=0.1;vS=0.1;speed=0} @target
  - skill{s=Crimson_Poison} @target

Crimson_Poison:
  Conditions:
  - random 0.15
  Skills:
  - potion{type=POISON;duration=60;level=1} @target
  - potion{type=WEAKNESS;duration=60;level=1} @target
  - effect:particles{particle=redstone;color=#5c0d0d;amount=3;speed=0;y=1} @target

# --- CRIMSON EXECUTOR ---
Crimson_Executor:
  Cooldown: 4
  Skills:
  - auraremove{aura=Crimson_Combo} @self
  - sound{s=entity.player.attack.crit;v=1;p=1.3} @self
  - skill{s=Crimson_Slash_Vertical} @self
  - delay 2
  - skill{s=Crimson_Slash_Horizontal} @self
  - delay 2
  - skill{s=Crimson_Slash_Diagonal} @self
  - delay 2
  - sound{s=entity.wither.death;v=0.6;p=1.6} @self
  - effect:particlering{particle=redstone;color=#ff2b2b;radius=2;points=20;amount=2;y=1.1} @self
  - skill{s=Crimson_Stun_Apply} @PlayersInRadius{radius=2}

Crimson_Stun_Apply:
  Skills:
  - damage{amount=6} @target
  - potion{type=SLOW;duration=30;level=100} @target
  - potion{type=WEAKNESS;duration=30;level=2} @target
  - potion{type=JUMP;duration=30;level=-10} @target
  - potion{type=MINING_FATIGUE;duration=30;level=5} @target
  - effect:particles{particle=crit;amount=5;hS=0.2;vS=0.3;y=1;speed=0} @target

# --- CRIMSON CLEAR SKY ---
Crimson_ClearSky:
  Cooldown: 15
  Skills:
  - auraremove{aura=Crimson_Combo} @self
  - sound{s=entity.player.attack.sweep;v=1;p=0.6} @self
  - effect:particlering{particle=redstone;color=#ff2b2b;radius=1.5;points=20;amount=2;y=1.1} @self
  - effect:particlering{particle=flame;radius=1.5;points=20;amount=1;y=1.1} @self
  - delay 1
  - effect:particlering{particle=redstone;color=#ff2b2b;radius=4;points=40;amount=2;y=1.1} @self
  - effect:particlering{particle=flame;radius=4;points=40;amount=1;y=1.1} @self
  - delay 1
  - effect:particlering{particle=redstone;color=#ff2b2b;radius=7;points=60;amount=2;y=1.1} @self
  - effect:particlering{particle=flame;radius=7;points=60;amount=1;y=1.1} @self
  - potion{type=SLOW;duration=20;level=5} @PlayersInRadius{radius=6}
  - damage{amount=14} @PlayersInRadius{radius=6}

# --- CRIMSON SAIKYOU FORM ---
Crimson_Saikyou_Form:
  Cooldown: 30
  Skills:
  - auraremove{aura=Crimson_Combo} @self
  - sound{s=entity.ender_dragon.growl;v=1;p=0.8} @self
  - effect:particlering{particle=redstone;color=#ff2b2b;radius=1;points=20;amount=2;y=1.1} @self
  - skill{s=Crimson_ClearSky} @self
  - delay 3
  - skill{s=Crimson_Slash_Vertical} @self
  - delay 2
  - skill{s=Crimson_Slash_Horizontal} @self
  - delay 2
  - skill{s=Crimson_Slash_Diagonal} @self
  - delay 3
  - skill{s=Crimson_Executor} @self
