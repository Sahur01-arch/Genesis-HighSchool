Crimson_Idle:
  Skills:
  - effect:particles{particle=flame;amount=1;hS=0.15;vS=0.15;speed=0.01} @self
  - effect:particles{particle=redstone;color=#ff2b2b;amount=1;hS=0.15;vS=0.15;speed=0.01} @self

Crimson_Slash:
  Cooldown: 0.3
  Conditions:
  - hasaurastacks{auraName=Crimson_Combo;stacks=2} castinstead Crimson_Executor
  Skills:
  - Aura{auraName=Crimson_Combo;duration=40;maxStacks=3} @self
  - sound{s=entity.player.attack.sweep;v=1;p="random(0.9,1.1)"} @self
  - projectile{onTick=Crimson_Slash_Shape;onHit=Crimson_Slash_Hit;v=6;i=1;hR=1.5;vR=1.5;hnp=true} @Forward{f=1;y=1}

Crimson_Slash_Shape:
  Skills:
  - slash{y=0;w=3;h=20;mpd=true;a=140;radius=1.5;roll=0;
      oP=[ - effect:particles{particle=redstone;color=#ff2b2b;amount=1}
           - effect:particles{particle=flame;amount=1;speed=0.01} ]
    } @origin

Crimson_Slash_Hit:
  Skills:
  - damage{amount=5} @target
  - effect:particles{particle=lava;amount=6;hS=0.2;vS=0.2} @target

Crimson_Executor:
  Cooldown: 4
  Skills:
  - auraremove{aura=Crimson_Combo} @self
  - sound{s=entity.wither.death;v=0.5;p=1.8} @self
  - effect:particlering{particle=redstone;color=#ff2b2b;radius=1;points=30;amount=4} @self
  - effect:particlering{particle=flame;radius=1;points=30;amount=2} @self
  - delay 1
  - effect:particlering{particle=redstone;color=#ff2b2b;radius=2.5;points=60;amount=4} @self
  - effect:particlering{particle=flame;radius=2.5;points=60;amount=2} @self
  - damage{amount=16} @PlayersInRadius{radius=3}

Crimson_Poison:
  Conditions:
  - random 0.15
  Skills:
  - potion{type=POISON;duration=60;level=1} @PlayersInRadius{radius=3}
  - potion{type=WEAKNESS;duration=60;level=1} @PlayersInRadius{radius=3}
  - effect:particles{particle=redstone;color=#5c0d0d;amount=8;speed=0} @self

Crimson_ClearSky:
  Cooldown: 15
  Skills:
  - auraremove{aura=Crimson_Combo} @self
  - sound{s=entity.player.attack.sweep;v=1;p=0.6} @self
  - effect:particlering{particle=redstone;color=#ff2b2b;radius=1.5;points=40;amount=5} @self
  - effect:particlering{particle=flame;radius=1.5;points=40;amount=2} @self
  - delay 1
  - effect:particlering{particle=redstone;color=#ff2b2b;radius=4;points=90;amount=5} @self
  - effect:particlering{particle=flame;radius=4;points=90;amount=2} @self
  - delay 1
  - effect:particlering{particle=redstone;color=#ff2b2b;radius=7;points=150;amount=5} @self
  - effect:particlering{particle=flame;radius=7;points=150;amount=2} @self
  - potion{type=SLOW;duration=20;level=5} @PlayersInRadius{radius=6}
  - damage{amount=14} @PlayersInRadius{radius=6}


