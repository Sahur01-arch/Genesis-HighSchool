# ============================================================
# CRIMSON SCYTHE - REVISI (v3: reverse-engineered dari SimpleSlash.yml)
#
# PERUBAHAN ARSITEKTUR PENTING:
# - Mekanik "slash{}" yang dipakai sebelumnya DIHAPUS TOTAL karena tidak
#   terverifikasi sebagai mekanik gratis yang valid di MythicMobs.
# - Diganti teknik dari SimpleSlash.yml: bentuk digambar titik-per-titik
#   pakai projectile{v=0;mr=1;d=2} (projectile diam, cuma "kedip" 1 partikel
#   di koordinat presisi syo/sso/sfo), lalu titik2 itu diungkap berurutan
#   pakai "delay 1" -> beranimasi.
# - DETEKSI HIT (damage) sekarang DIPISAH TOTAL dari VISUAL (bentuk slash).
#   Ini akar penyebab "proyektil kena musuh sekali visualnya kepotong"
#   sebelumnya: dulu bentuk digambar via onTick dari proyektil yg bergerak
#   & bisa berhenti kapan saja saat kena musuh. Sekarang bentuk selalu
#   selesai digambar penuh (independen), proyektil hit-check terpisah kecil
#   di depan cuma untuk menentukan kena/tidak.
#
# MATEMATIKA BENTUK (lihat analisa):
# Tiap titik = lingkaran radius R, pivot R di depan pemain, sudut theta dari
# -halfAngle..+halfAngle:
#   fwd_local = R*cos(theta) ;  a_local = R*sin(theta)
#   side = a_local*cos(roll) ;  vert = a_local*sin(roll)
#   sfo = F0 + (R - fwd_local) ; sso = side ; syo = Y0 + vert
# roll=0 -> vertikal murni | roll=90 -> horizontal murni | roll=45 -> diagonal
# ============================================================

Crimson_Idle:
  Skills:
  - effect:particles{particle=flame;amount=1;hS=0.15;vS=0.15;speed=0} @self
  - effect:particles{particle=redstone;color=#ff2b2b;amount=1;hS=0.15;vS=0.15;speed=0} @self

# Satu "titik" slash (dipanggil puluhan kali oleh projectile ot= di bawah)
Crimson_Point:
  Skills:
  - effect:particles{particle=redstone;color=#ff2b2b;amount=1;speed=0} @origin
  - effect:particles{particle=flame;amount=1;speed=0} @origin

# --- CRIMSON SLASH ---------------------------------------------------------
Crimson_Slash:
  Cooldown: 0.3
  Conditions:
  - hasaurastacks{auraName=Crimson_Combo;stacks=2} castinstead Crimson_Executor
  Skills:
  - Aura{auraName=Crimson_Combo;duration=40;maxStacks=3} @self
  - sound{s=entity.player.attack.sweep;v=1;p="random(0.9,1.1)"} @self
  - randomskill{skills=Crimson_Slash_Vertical,Crimson_Slash_Horizontal,Crimson_Slash_Diagonal} @self

# Deteksi hit: proyektil kecil BERGERAK (v>0) terpisah dari visual.
Crimson_Slash_HitCheck:
  Skills:
  - projectile{onHit=Crimson_Slash_Hit;v=2.2;i=1;mr=2.2;hR=1.3;vR=1.3;hnp=true;g=0} @Forward{f=0.5;y=1.1}

Crimson_Slash_Vertical:
  Skills:
  - skill{s=Crimson_Slash_HitCheck} @self
  - skill{s=Crimson_Slash_Shape_V} @self

Crimson_Slash_Horizontal:
  Skills:
  - skill{s=Crimson_Slash_HitCheck} @self
  - skill{s=Crimson_Slash_Shape_H} @self

Crimson_Slash_Diagonal:
  Skills:
  - skill{s=Crimson_Slash_HitCheck} @self
  - skill{s=Crimson_Slash_Shape_D} @self

# Bentuk visual (murni titik-titik diam, tidak bergerak, tidak bisa "kepotong")
