Crimson_Saikyou_Form:
  Cooldown: 30
  Skills:
  - auraremove{aura=Crimson_Combo} @self
  - sound{s=entity.ender_dragon.growl;v=1;p=0.8} @self
  - skill{s=Crimson_Saikyou_Star_N} @self
  - skill{s=Crimson_Saikyou_Star_NE} @self
  - skill{s=Crimson_Saikyou_Star_E} @self
  - skill{s=Crimson_Saikyou_Star_SE} @self
  - damage{amount=10} @PlayersInRadius{radius=2.4}
  - delay 4
  - skill{s=Crimson_ClearSky} @self
  - delay 6
  - skill{s=Crimson_Slash_Vertical} @self
  - delay 4
  - skill{s=Crimson_Slash_Horizontal} @self
  - delay 4
  - skill{s=Crimson_Slash_Diagonal} @self
  - delay 5
  - skill{s=Crimson_Executor} @self

# ============================================================
# ROUTER - dipanggil dari item (Oraxen/Skript) via "mm test cast <skill>"
# ============================================================
# Klik kanan          -> Slash biasa
# Sneak+Jump+klik kanan -> Saikyou Form
Crimson_RightClick_Router:
  Cooldown: 0.3
  Conditions:
  - crouching true castinstead Crimson_RightClick_CrouchCheck
  Skills:
  - skill{s=Crimson_Slash} @self

Crimson_RightClick_CrouchCheck:
  Conditions:
  - jumping true castinstead Crimson_Saikyou_Form
  Skills:
  - skill{s=Crimson_Slash} @self

# Sneak + klik kiri, HARUS kena entity -> Clear Sky
# (proyektil kecil dulu; Clear Sky sendiri sudah ber-Condition "crouching true"
#  jadi tidak akan meledak kalau dipanggil dari jalur lain tanpa sneak)
Crimson_LeftClick_Router:
  Conditions:
  - crouching true castinstead Crimson_ClearSky_Attempt
  Skills:
  - sound{s=item.book.page_turn;v=0.3;p=1.5} @self

Crimson_ClearSky_Attempt:
  Cooldown: 15
  Skills:
  - projectile{onHit=Crimson_ClearSky_Confirm;v=3;i=1;mr=3;hR=1.5;vR=1.5;hnp=true} @Forward{f=1;y=1.1}

Crimson_ClearSky_Confirm:
  Skills:
  - skill{s=Crimson_ClearSky} @self
