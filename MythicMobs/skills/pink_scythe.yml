# --- SAKURA SLASH 1/2/3 (Proyektil Meluncur ke Depan) --- 
# --- SAKURA SLASH 1/2/3 (Proyektil Meluncur) ---
Sakura_Slash_1:
  Cooldown: 0.4
  Conditions:
  - hasaurastacks{auraName=Sakura_Combo;stacks=1} castinstead Sakura_Slash_2
  Skills:
  - Aura{auraName=Sakura_Combo;duration=30;maxStacks=3} @self
  - sound{s=entity.player.attack.sweep;v=0.8;p=1.6} @self
  - projectile{onTick=Sakura_Slash_Shape_1;onHit=Sakura_Slash_Hit_1;v=1;i=1;mr=8;hR=1.5;vR=1.5;hnp=true;g=0} @Forward{f=1;y=1.1}

Sakura_Slash_2:
  Cooldown: 0.4
  Conditions:
  - hasaurastacks{auraName=Sakura_Combo;stacks=2} castinstead Sakura_Slash_3
  Skills:
  - Aura{auraName=Sakura_Combo;duration=30;maxStacks=3} @self
  - sound{s=entity.player.attack.sweep;v=0.9;p=1.8} @self
  - projectile{onTick=Sakura_Slash_Shape_2;onHit=Sakura_Slash_Hit_1;v=1;i=1;mr=8;hR=1.5;vR=1.5;hnp=true;g=0} @Forward{f=1;y=1.1}

Sakura_Slash_3:
  Cooldown: 1.5
  Skills:
  - auraremove{aura=Sakura_Combo} @self
  - sound{s=entity.player.attack.crit;v=1;p=1.5} @self
  - effect:particlering{particle=cherry_leaves;radius=2;points=20;amount=1;y=1.2} @self
  - projectile{onTick=Sakura_Slash_Shape_3;onHit=Sakura_Slash_Hit_3;v=1;i=1;mr=8;hR=2;vR=2;hnp=true;g=0} @Forward{f=1;y=1.1}

# --- BENTUK TEBASAN SAKURA (Mengikuti Proyektil) ---
Sakura_Slash_Shape_1:
  Skills:
  - slash{y=0;w=3;h=25;mpd=true;a=100;radius=2.5;roll=0;
      oP=[ - effect:particles{particle=cherry_leaves;amount=1;speed=0} ]
    } @origin

Sakura_Slash_Shape_2:
  Skills:
  - slash{y=0;w=3;h=25;mpd=true;a=110;radius=2.7;roll=25;
      oP=[ - effect:particles{particle=cherry_leaves;amount=1;speed=0} ]
    } @origin

Sakura_Slash_Shape_3:
  Skills:
  - slash{y=0;w=4;h=30;mpd=true;a=160;radius=3;roll=-25;
      oP=[ - effect:particles{particle=cherry_leaves;amount=2;speed=0} ]
    } @origin

# --- SAKURA DAMAGE (Memicu saat proyektil mengenai target) ---
Sakura_Slash_Hit_1:
  Skills:
  - damage{amount=4} @target
  - effect:particles{particle=cherry_leaves;amount=3;speed=0;y=1} @target

Sakura_Slash_Hit_3:
  Skills:
  - damage{amount=8} @target
  - effect:particles{particle=cherry_leaves;amount=5;speed=0;y=1} @target

Sakura_Slash_Tick_1:
  Skills:
  - slash{y=1.2;w=3;h=25;mpd=true;a=100;radius=2.5;roll=0;
      oP=[ - effect:particles{particle=cherry_leaves;amount=2;speed=0} ]
    } @origin

Sakura_Slash_Tick_2:
  Skills:
  - slash{y=1.2;w=3;h=25;mpd=true;a=110;radius=2.7;roll=25;
      oP=[ - effect:particles{particle=cherry_leaves;amount=2;speed=0} ]
    } @origin

Sakura_Slash_Tick_3:
  Skills:
  - slash{y=1.2;w=4;h=30;mpd=true;a=160;radius=3;roll=-25;
      oP=[ - effect:particles{particle=cherry_leaves;amount=3;speed=0} ]
    } @origin

Sakura_Slash_Hit_1:
  Skills:
  - damage{amount=4} @target
  - effect:particles{particle=cherry_leaves;amount=5;speed=0.05} @target

Sakura_Slash_Hit_3:
  Skills:
  - damage{amount=8} @target
  - effect:particles{particle=cherry_leaves;amount=8;speed=0.05} @target

# --- SAKURA WALTZ (Fix Teleport Underground dengan Y=1.5) ---
Sakura_Waltz:
  Cooldown: 20
  Skills:
  - auraremove{aura=Sakura_Combo} @self
  - sound{s=entity.player.attack.sweep;v=1;p=1.8} @self
  - effect:particles{particle=cherry_leaves;amount=5;hS=0.3;vS=0.3;speed=0.05} @self

  - teleportto{m=relative;c=0,1.5,-2;origin=target} @self
  - sound{s=entity.enderman.teleport;v=0.6;p=1.6} @self
  - damage{amount=6} @target
  - effect:particles{particle=cherry_leaves;amount=3;speed=0} @target
  - delay 3

  - teleportto{m=relative;c=0,1.5,2;origin=target} @self
  - sound{s=entity.enderman.teleport;v=0.6;p=1.6} @self
  - damage{amount=6} @target
  - effect:particles{particle=cherry_leaves;amount=3;speed=0} @target
  - delay 3

  - teleportto{m=relative;c=-2,1.5,0;origin=target} @self
  - sound{s=entity.enderman.teleport;v=0.6;p=1.6} @self
  - damage{amount=6} @target
  - effect:particles{particle=cherry_leaves;amount=3;speed=0} @target
  - delay 3

  - teleportto{m=relative;c=2,1.5,0;origin=target} @self
  - sound{s=entity.enderman.teleport;v=0.6;p=1.6} @self
  - damage{amount=6} @target
  - effect:particles{particle=cherry_leaves;amount=3;speed=0} @target
  - delay 4

  - sound{s=entity.player.attack.crit;v=1;p=1.2} @self
  - lunge{velocity=0;velocityY=1.1} @self
  - delay 10
  - effect:particlering{particle=cherry_leaves;radius=2.5;points=20;amount=2;y=0.1} @self
  - sound{s=entity.generic.explode;v=0.6;p=1.4} @self
  - damage{amount=10} @PlayersInRadius{radius=3}
