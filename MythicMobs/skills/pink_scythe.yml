# --- SAKURA STEP --------------------------------------------------------
Sakura_Step:
  Cooldown: 1.2
  Skills:
  - sound{s=entity.player.attack.sweep;v=0.6;p=1.6} @self
  - onDamaged{auraName=Sakura_LandResist;cancelEvent=true;d=20;damageMods="FALL 0"} @self
  - lunge{velocity=1.3;velocityY=0.15} @forward{f=14;lockpitch=true}
  - effect:particles{particle=cherry_leaves;amount=10;hS=0.2;vS=0.2;speed=0.1} @Forward{f=7;y=1}
  - potion{type=SPEED;duration=30;level=1} @self

# --- SAKURA FLICKER -------------------------------------------------------
Sakura_Flicker:
  Conditions:
  - hasaurastacks{auraName=Sakura_Combo;stacks=3} true
  Cooldown: 3
  Skills:
  - auraremove{aura=Sakura_Combo} @self
  - sound{s=entity.enderman.teleport;v=0.7;p=1.4} @self
  - effect:particles{particle=cherry_leaves;amount=20;hS=0.4;vS=0.4;speed=0.1} @self
  - teleport{} @forward{f=6;y=0.2}
  - effect:particles{particle=cherry_leaves;amount=20;hS=0.4;vS=0.4;speed=0.1} @self
  - damage{amount=4} @PlayersInRadius{radius=2}

# --- SAKURA BLOOM ----------------------------------------------------------
Sakura_Bloom:
  Cooldown: 10
  Skills:
  - sound{s=entity.player.levelup;v=0.5;p=1.5} @self
  - effect:particles{particle=cherry_leaves;amount=25;hS=0.6;vS=0.8;speed=0.05;y=1} @self
  - potion{type=SPEED;duration=100;level=2} @self
  - potion{type=JUMP;duration=100;level=1} @self

# --- SAKURA WALTZ ----------------------------------------------------------
Sakura_Waltz:
  Cooldown: 18
  Skills:
  - sound{s=entity.player.attack.sweep;v=1;p=1.8} @self
  - skill{s=Sakura_Step} @self
  - delay 6
  - skill{s=Sakura_Slash_1} @self
  - delay 6
  - skill{s=Sakura_Slash_2} @self
  - delay 6
  - skill{s=Sakura_Slash_3} @self
  - delay 4
  - sound{s=entity.enderman.teleport;v=0.7;p=1.4} @self
  - effect:particles{particle=cherry_leaves;amount=20;hS=0.4;vS=0.4;speed=0.1} @self
  - teleport{} @forward{f=6;y=0.2}
  - effect:particles{particle=cherry_leaves;amount=20;hS=0.4;vS=0.4;speed=0.1} @self
  - damage{amount=4} @PlayersInRadius{radius=2}

# ============================================================
# ROUTER
# ============================================================
# Klik kanan               -> combo Sakura_Slash 1/2/3
# Sneak + klik kanan       -> Sakura_Step (dash)
# Sneak + Jump + klik kanan -> Sakura_Waltz (ultimate)
Sakura_RightClick_Router:
  Conditions:
  - crouching true castinstead Sakura_RightClick_CrouchCheck
  Skills:
  - skill{s=Sakura_Slash_1} @self

Sakura_RightClick_CrouchCheck:
  Conditions:
  - jumping true castinstead Sakura_Waltz
  Skills:
  - skill{s=Sakura_Step} @self
