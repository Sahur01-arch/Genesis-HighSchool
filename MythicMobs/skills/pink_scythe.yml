# ============================================================
# SAKURA SCYTHE - REVISI (v3: reverse-engineered dari SimpleSlash.yml)
# Arsitektur sama seperti red_scythe.yml v3: hit-detection dipisah dari
# visual. Visual = titik-titik matematis (lingkaran radius R, sudut theta),
# roll sedikit bergantian tiap hit combo (15,-15,0 derajat) supaya terasa
# seperti gerakan sabit natural berayun kiri-kanan-lurus, bukan 3x tebasan
# identik.
# ============================================================

Sakura_Idle:
  Skills:
  - effect:particles{particle=cherry_leaves;amount=1;hS=0.2;vS=0.3;speed=0.02} @self

Sakura_Point:
  Skills:
  - effect:particles{particle=cherry_leaves;amount=1;speed=0} @origin

# --- SAKURA SLASH 1/2/3 ------------------------------------------------------
Sakura_HitCheck_Light:
  Skills:
  - projectile{onHit=Sakura_Hit_Light;v=2;i=1;mr=2;hR=1.2;vR=1.2;hnp=true;g=0} @Forward{f=0.5;y=1.2}

Sakura_HitCheck_Heavy:
  Skills:
  - projectile{onHit=Sakura_Hit_Heavy;v=2;i=1;mr=2.5;hR=1.4;vR=1.4;hnp=true;g=0} @Forward{f=0.5;y=1.2}

Sakura_Hit_Light:
  Skills:
  - damage{amount=4} @target
  - effect:particles{particle=cherry_leaves;amount=2;speed=0} @target

Sakura_Hit_Heavy:
  Skills:
  - damage{amount=8} @target
  - effect:particles{particle=cherry_leaves;amount=4;speed=0} @target

