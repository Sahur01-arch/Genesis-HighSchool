    - minecraft:smooth_red_sandstone
    - minecraft:deepslate
    - minecraft:blackstone
    - minecraft:netherrack
  shulker_inventory:
    # Drop items in the inventory on death (will not change ability description, for that edit the translations.yml file)
    drop_on_death: false
    trigger:
      # The action (e.g. LEFT_CLICK, RIGHT_CLICK) that triggers this ability
      # You can see a full list of actions at https://starshooter.gitbook.io/origins-reborn/configuration#triggerable-ability-configuration
      type: RIGHT_CLICK_CHESTPLATE
      # The conditions (e.g. EMPTY_HAND, NO_BLOCK) that are required to trigger this ability
      # You can see a full list of conditions at https://starshooter.gitbook.io/origins-reborn/configuration#triggerable-ability-configuration
      conditions: []
  natural_armor:
    attribute-modifier:
      # The operation to use ('ADD_SCALAR', 'ADD_NUMBER' or 'MULTIPLY_SCALAR_1')
      operation: ADD_NUMBER
      # A mathematical expression used to modify the attribute, where 'x' is a variable representing the default modifier.
      # Example: 'x * 3' will triple the value used in the modifier.
      expression: x
  conduit_power_on_land:
    # Whether to force compatibility with other abilities
    # Less efficient, but prevents it breaking if a player has both this and an ability like origins:water_vulnerability
    forced_compatibility: false
  extra_reach_blocks:
